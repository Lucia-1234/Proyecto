<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>

<header>
    <h1 class="Pagina_login__bienvenida">
        ¡Bienvenido!
    </h1>

    <div class="header_img">
        <img src="IMG/User.png" alt="Usuario" class="avatar">
    </div>
</header>

<main>
  <div class="Pagina_login__main">

    <div class="main_campo">
      <img src="IMG/User.png" class="main_campo__icono">
      <input type="text" id="usuario" placeholder="Usuario">
    </div>

    <div class="main_campo">
      <img src="IMG/Password.png" class="main_campo__icono">
      <input type="password" id="contraseña" placeholder="Contraseña">
    </div>

    <button class="footer_boton">
      <a class="footer_boton__enlace" href="#">Ingresar</a>
    </button>

  </div>
</main>

    
</body>
</html>
