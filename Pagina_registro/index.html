<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="Pagina_registro">
            <h1 class="Pagina_registro__bienvenida">
                Registro
            </h1>
            <img src="IMG/logo_paujil.png" alt="logo">
        </div>
    </header>

    <main>
        <div class="Pagina_registro__main">
            <img src="IMG/User_black.png" alt="#" class="main_img">
            <input type="text" placeholder=" Nombre/Apellido" class="main_campo">

            <img src="IMG/email.png" alt="#" class="main_img">
            <input type="email" placeholder="Correo electronico" class="main_campo">

            <img src="IMG/telephone.png" alt="#" class="main_img">
            <input type="text" placeholder="Telefono" class="main_campo">

            <img src="IMG/Password.png" alt="#" class="main_img">
            <input type="password" placeholder="Contraseña" class="main_campo">

            <img src="IMG/Password_confirmed.png" alt="#" class="main_img">
            <input type="password" placeholder="Confirmar contraseña" class="main_campo">

            <button class="main_boton">
                <a class="main_boton__enlace" href="#">Visitante</a>
            </button>

            <button class="main_boton">
                <a class="main_boton__enlace" href="#">Trabajador</a>
            </button>
        </div>
    </main>
</body>
</html>
